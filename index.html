<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>GameHub</title>
    <style>
        :root {
            --bg-dark: #080b10;
            --bg-card: #121824;
            --accent: #a855f7;
            --danger: #ef4444;
            --success: #22c55e;
            --text-main: #f3f4f6;
            --text-muted: #6b7280;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-dark); color: var(--text-main); padding-bottom: 70px; overflow-x: hidden; }
        header { background-color: var(--bg-card); padding: 15px; display: flex; flex-direction: column; align-items: center; gap: 10px; border-bottom: 1px solid #1e293b; }
        .logo { font-size: 22px; font-weight: 800; background: linear-gradient(45deg, var(--accent), #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .wallet-zone { display: flex; align-items: center; gap: 10px; width: 100%; justify-content: center; }
        .wallet { background: #1e293b; padding: 8px 14px; border-radius: 20px; font-size: 14px; border: 1px solid #334155; font-weight: bold; }
        .wallet span { color: var(--success); }
        .bonus-btn { background: var(--accent); color: white; border: none; padding: 8px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; cursor: pointer; transition: opacity 0.2s; }
        .bonus-btn:disabled { background: #1f293d; color: var(--text-muted); cursor: not-allowed; }
        .container { max-width: 600px; margin: 20px auto; padding: 0 15px; }
        .page { display: none; }
        .page.active { display: block; }
        .game-card { background: var(--bg-card); border-radius: 12px; overflow: hidden; border: 1px solid #1e293b; margin-bottom: 15px; }
        
        .poster { width: 100%; aspect-ratio: 16 / 9; background-color: #0f1420; position: relative; cursor: pointer; overflow: hidden; }
        .poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .web-tag { position: absolute; top: 10px; right: 10px; background: var(--accent); color: white; padding: 4px 8px; font-size: 11px; font-weight: bold; border-radius: 4px; box-shadow: 0 0 10px var(--accent); z-index: 2; }
        
        .info { padding: 15px; }
        .title { font-size: 18px; font-weight: bold; margin-bottom: 8px; }
        .desc { font-size: 13px; color: #9ca3af; margin-bottom: 15px; line-height: 1.4; }
        .btn { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; font-size: 14px; text-align: center; }
        .btn:disabled { background: #1f293d; color: var(--text-muted); cursor: not-allowed; }
        
        #launcher-overlay { display: none; position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; background: #000; z-index: 9999; }
        #launcher-overlay.open { display: block; }
        #launcher-iframe { width: 100%; height: 100%; border: none; }
        #exit-gesture-zone { position: absolute; top: 0; left: 0; right: 0; height: 22px; z-index: 10001; background: transparent; touch-action: manipulation; }
        
        .loader-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: white; padding: 20px; }
        .progress-bar { width: 80%; height: 10px; background: #222; border-radius: 5px; margin-top: 20px; overflow: hidden; border: 1px solid var(--accent); }
        .progress-fill { height: 100%; width: 0%; background: var(--accent); transition: width 0.1s; }
        
        nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg-card); display: flex; border-top: 1px solid #1e293b; z-index: 100; }
        .nav-item { flex: 1; text-align: center; padding: 15px 0; color: #6b7280; font-size: 14px; cursor: pointer; font-weight: bold; }
        .nav-item.active { color: var(--accent); }
        
        .toast { position: fixed; bottom: 80px; left: 50%; transform: translate(-50%, 100px); background: #1e192d; color: white; padding: 12px 24px; border-radius: 20px; border: 1px solid var(--accent); opacity: 0; transition: all 0.3s; z-index: 10000; text-align: center; font-weight: bold; pointer-events: none; }
        .toast.show { transform: translate(-50%, 0); opacity: 1; }

        .neon-card { background: linear-gradient(160deg, #151b2c 0%, #0a0e17 100%); border: 1px solid var(--accent); border-radius: 16px; padding: 20px; box-shadow: 0 0 26px rgba(168,85,247,.28), inset 0 0 34px rgba(168,85,247,.07); }
        .prof-head { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
        .prof-avatar-wrapper { position: relative; width: 72px; height: 72px; cursor: pointer; flex-shrink: 0; }
        .prof-avatar-big { width: 100%; height: 100%; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 30% 25%, #2a1e45, #0e0a18); border: 2px solid var(--accent); box-shadow: 0 0 18px rgba(168,85,247,.6); overflow: hidden; }
        .prof-avatar-big img { width: 100%; height: 100%; object-fit: cover; }
        .prof-avatar-camera { position: absolute; bottom: -4px; right: -4px; width: 28px; height: 28px; background: var(--accent); border: 2px solid #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 999; box-shadow: 0 2px 8px rgba(0,0,0,0.8); }
        .prof-name { font-size: 20px; font-weight: 800; }
        .prof-sub { font-size: 12px; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; }
        .field { margin-bottom: 16px; }
        .field > label { display: block; font-size: 13px; color: #9ca3af; margin-bottom: 7px; font-weight: 600; }
        .field-input { width: 100%; background: #1e293b; border: 1px solid #334155; color: var(--text-main); padding: 11px 12px; border-radius: 8px; font-size: 14px; outline: none; }
        .field-input:focus { border-color: var(--accent); box-shadow: 0 0 12px rgba(168,85,247,.4); }
        .stats { margin-top: 6px; border-top: 1px solid #1e293b; padding-top: 16px; }
        .stat-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px dashed #1e293b; font-size: 14px; }
        .stat-row:last-child { border-bottom: none; }
        .stat-row span { color: #9ca3af; }
        .stat-row b { color: var(--text-main); font-size: 15px; }
        #prof-balance { color: var(--success); }

        .comments-section { background: var(--bg-card); border-radius: 12px; padding: 20px; border: 1px solid #1e293b; margin-top: 15px; }
        .comments-section h3 { font-size: 16px; margin-bottom: 15px; color: var(--accent); }
        .comment-item { background: #1e293b; border-radius: 8px; padding: 10px; margin-bottom: 10px; border-left: 3px solid var(--accent); }
        .comment-author { font-weight: bold; font-size: 13px; color: #cbd5e1; }
        .comment-text { font-size: 13px; color: #9ca3af; margin-top: 5px; line-height: 1.4; }
        .comment-input-area { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .comment-input-area textarea { width: 100%; background: #1e293b; border: 1px solid #334155; color: var(--text-main); padding: 10px; border-radius: 8px; resize: none; outline: none; }
        .comment-input-area textarea:focus { border-color: var(--accent); }

        #boot { position: fixed; inset: 0; background: #000; z-index: 20000; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: opacity .5s; }
        #boot.hide { opacity: 0; pointer-events: none; }
        .boot-logo-wrap { position: relative; overflow: hidden; padding: 10px 18px; animation: bootGlow 1s ease 1.5s both; }
        .boot-logo { display: flex; align-items: baseline; font-weight: 900; font-size: 62px; letter-spacing: 1px; user-select: none; }
        .boot-g { background: linear-gradient(45deg, var(--accent), #3b82f6); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: bootG .45s cubic-bezier(.2,1.4,.4,1) both; }
        .boot-rest { overflow: hidden; white-space: nowrap; max-width: 0; opacity: 0; color: #f3f4f6; animation: bootRest 1s ease .55s forwards; }
        @keyframes bootG { from { opacity: 0; transform: scale(.5); filter: blur(8px); } to { opacity: 1; transform: scale(1); filter: blur(0); } }
        @keyframes bootRest { from { max-width: 0; opacity: 0; } to { max-width: 430px; opacity: 1; } }
        @keyframes bootGlow { from { filter: drop-shadow(0 0 0 rgba(168,85,247,0)); } to { filter: drop-shadow(0 0 26px rgba(168,85,247,.55)); } }
        .boot-logo-wrap::after { content: ''; position: absolute; top: -10%; bottom: -10%; width: 60px; left: -80px; transform: skewX(-20deg);
            background: linear-gradient(100deg, transparent, rgba(255,255,255,.5), transparent); animation: bootShine .7s ease 1.6s both; }
        @keyframes bootShine { to { left: 110%; } }
        .boot-bar { position: absolute; left: 50%; bottom: 18%; transform: translateX(-50%); width: 180px; height: 3px; background: #1e293b; border-radius: 2px; overflow: hidden; }
        .boot-bar i { display: block; height: 100%; width: 40%; background: var(--accent); border-radius: 2px; animation: bootBar 1.1s ease-in-out .4s infinite; }
        @keyframes bootBar { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
    </style>
</head>
<body>

    <div id="boot">
        <div class="boot-logo-wrap">
            <div class="boot-logo"><span class="boot-g">G</span><span class="boot-rest">ameHub</span></div>
        </div>
        <div class="boot-bar"><i></i></div>
    </div>

    <header>
        <div class="logo">GameHub</div>
        <div class="wallet-zone">
            <div class="wallet">Баланс: <span id="balance">0</span> NC</div>
            <button class="bonus-btn" id="bonus-btn" onclick="claimBonus()">Забрать 10 NappyCoins</button>
        </div>
    </header>

    <div class="container">
        <div id="store" class="page active">
            <div id="store-list"></div>
        </div>
        <div id="library" class="page">
            <div id="library-list"></div>
        </div>
        <div id="profile" class="page">
            <div class="neon-card">
                <div class="prof-head">
                    <div class="prof-avatar-wrapper" onclick="document.getElementById('avatar-upload').click()">
                        <div class="prof-avatar-big">
                            <img id="prof-avatar-img" src="" style="display:none;" alt="Аватар">
                            <div id="prof-avatar-txt">
                                <svg viewBox="0 0 24 24" width="40" height="40" fill="#6b7280">
                                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                                </svg>
                            </div>
                        </div>
                        <div class="prof-avatar-camera">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                                <circle cx="12" cy="13" r="4"></circle>
                            </svg>
                        </div>
                    </div>
                    <div>
                        <div class="prof-name" id="prof-name-display">Gamer_Nappy</div>
                        <div class="prof-sub">Nappy Gamer</div>
                    </div>
                </div>
                <div class="field">
                    <label>Никнейм</label>
                    <input id="nick-input" class="field-input" maxlength="20" placeholder="Gamer_Nappy" autocomplete="off" oninput="onNickInput(this)" onblur="onNickInput(this)" onchange="onNickInput(this)">
                </div>
                <input type="file" id="avatar-upload" accept="image/*" hidden onchange="handleAvatarUpload(this)">
                
                <div class="stats">
                    <div class="stat-row"><span>Баланс NappyCoins</span><b><span id="prof-balance">0</span> NC</b></div>
                </div>
            </div>
        </div>
        <div id="game-page" class="page">
            <div style="background: var(--bg-card); border-radius: 12px; padding: 20px; border: 1px solid #1e293b;">
                <button class="btn" style="background:#374151; margin-bottom:15px; width:auto;" onclick="switchTab('store')">← Назад в Магазин</button>
                <div class="game-view-title" style="font-size:24px; font-weight:bold; margin-bottom:10px;">EvoWorld.io</div>
                <div style="color:#9ca3af; font-size:14px; margin-bottom:20px;">Официальный мультиплеерный хит! Эволюционируй среди реальных игроков, пей воду и выживай.</div>
                <div id="action-zone"></div>
                
                <div class="comments-section">
                    <h3>💬 Отзывы игроков</h3>
                    <div id="comments-list">
                        <p style="color:var(--text-muted); font-size:12px;">Загрузка комментариев...</p>
                    </div>
                    <div class="comment-input-area">
                        <textarea id="comment-text" rows="2" placeholder="Напиши свой отзыв..."></textarea>
                        <button class="btn" style="background:var(--accent); padding:8px; font-size:12px;" onclick="postComment()">Отправить</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="launcher-overlay">
        <div id="exit-gesture-zone" title=""></div>
        <div class="loader-container" id="loader-screen">
            <div style="font-size: 24px; font-weight: bold;">Загрузка EvoWorld...</div>
            <div id="loader-percent" style="font-size: 18px; margin-top: 10px;">0%</div>
            <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
        </div>
        <iframe id="launcher-iframe" style="display:none;" src="about:blank" allowfullscreen allow="fullscreen; autoplay; gamepad"></iframe>
    </div>

    <div id="toast" class="toast"></div>

    <nav>
        <div class="nav-item active" id="tab-store" onclick="switchTab('store')">Магазин</div>
        <div class="nav-item" id="tab-library" onclick="switchTab('library')">Библиотека</div>
        <div class="nav-item" id="tab-profile" onclick="switchTab('profile')">Профиль</div>
    </nav>

    <script>
        const HQ_IMAGE = 'https://i.postimg.cc/RhqLK1PD/maxresdefault.jpg';

        const games = [{
            id: 'evoworld',
            title: 'EvoWorld.io (FlyOrDie.io)',
            desc: 'Начни мелкой черной мухой, эволюционируй среди реальных игроков, пей воду, ешь добычу и берегись хищников.'
        }];

        const STATE_KEY = 'gh_state_v23';

        function defaultProfile() {
            return { nickname: 'Gamer_Nappy', avatar: '' };
        }

        function loadState() {
            let s = null;
            try { s = JSON.parse(localStorage.getItem(STATE_KEY) || 'null'); } catch (e) { s = null; }

            let legacyOwned = [];
            try { legacyOwned = JSON.parse(localStorage.getItem('gh_owned') || '[]'); } catch (e) { legacyOwned = []; }
            const legacyBalance = parseInt(localStorage.getItem('gh_balance') || '0', 10) || 0;
            const legacyClaim = parseInt(localStorage.getItem('gh_last_claim') || '0', 10) || 0;

            if (!s || typeof s !== 'object') {
                s = { balance: legacyBalance, owned: legacyOwned, lastClaim: legacyClaim, profile: defaultProfile() };
            }
            if (typeof s.balance !== 'number') s.balance = legacyBalance;
            if (!Array.isArray(s.owned)) s.owned = legacyOwned;
            if (typeof s.lastClaim !== 'number') s.lastClaim = legacyClaim;
            if (!s.profile || typeof s.profile !== 'object') s.profile = defaultProfile();
            if (!s.profile.nickname) s.profile.nickname = 'Gamer_Nappy';
            
            if (s.profile.avatar && !s.profile.avatar.startsWith('data:image')) {
                s.profile.avatar = '';
            }
            delete s.profile.maxEvolution;
            
            return s;
        }

        const _state = loadState();
        let owned = _state.owned;
        let balance = _state.balance;
        let lastClaim = _state.lastClaim;
        let profile = _state.profile;

        let loadTimer = null;
        let gameOpen = false;
        let ignorePop = false;

        function saveState() {
            const payload = { balance: balance, owned: owned, lastClaim: lastClaim, profile: profile };
            try {
                localStorage.setItem(STATE_KEY, JSON.stringify(payload));
                localStorage.setItem('gh_balance', JSON.stringify(balance));
                localStorage.setItem('gh_owned', JSON.stringify(owned));
                localStorage.setItem('gh_last_claim', JSON.stringify(lastClaim));
            } catch (e) {
                showToast('Не удалось сохранить');
            }
        }

        function showToast(msg) {
            const t = document.getElementById('toast'); t.innerText = msg; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        function updateUI() {
            document.getElementById('balance').innerText = balance;
            const btn = document.getElementById('bonus-btn');
            const now = Date.now();
            if (now - lastClaim < 24*60*60*1000) {
                btn.disabled = true;
                const rem = (24*60*60*1000) - (now - lastClaim);
                const hrs = Math.floor(rem / (60*60*1000));
                btn.innerText = 'Через ' + hrs + ' ч.';
            } else {
                btn.disabled = false; btn.innerText = 'Забрать 10 NappyCoins';
            }
            const pb = document.getElementById('prof-balance');
            if (pb) pb.innerText = balance;
        }

        function claimBonus() {
            balance += 10; lastClaim = Date.now();
            saveState();
            updateUI(); showToast('+10 NappyCoins успешно начислены!');
        }

        function switchTab(tab) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            document.getElementById('tab-'+tab).classList.add('active');
            if(tab==='store') renderStore();
            if(tab==='library') renderLibrary();
            if(tab==='profile') renderProfile();
        }

        function esc(s) {
            return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function posterHTML(g, showTag) {
            return '<div class="poster" onclick="openGamePage(\'' + esc(g.id) + '\')">'
                + '<img src="' + HQ_IMAGE + '" alt="' + esc(g.title) + '" loading="lazy" draggable="false">'
                + (showTag ? '<div class="web-tag">WEB</div>' : '')
                + '</div>';
        }

        function renderStore() {
            const list = document.getElementById('store-list'); list.innerHTML = '';
            games.forEach(g => {
                const io = owned.includes(g.id);
                list.innerHTML += `
                    <div class="game-card">
                        ${posterHTML(g, true)}
                        <div class="info">
                            <div class="title" onclick="openGamePage('${g.id}')">${g.title}</div>
                            <div class="desc">${g.desc}</div>
                            <button class="btn" onclick="addToLib('${g.id}')" ${io?'disabled':''}>${io?'В библиотеке':'Забрать в библиотеку'}</button>
                        </div>
                    </div>`;
            });
        }

        function renderLibrary() {
            const list = document.getElementById('library-list'); list.innerHTML = '';
            if(owned.length === 0) { list.innerHTML = '<p style="color:var(--text-muted); text-align:center; margin-top:40px;">Библиотека пуста.</p>'; return; }
            games.forEach(g => {
                if(owned.includes(g.id)) {
                    list.innerHTML += `
                        <div class="game-card">
                            ${posterHTML(g, false)}
                            <div class="info">
                                <div class="title" onclick="openGamePage('${g.id}')">${g.title}</div>
                                <button class="btn" style="background:var(--success); margin-top:15px;" onclick="openGamePage('${g.id}')">Открыть Лаунчер</button>
                            </div>
                        </div>`;
                }
            });
        }

        function addToLib(id) {
            if(!owned.includes(id)) owned.push(id);
            saveState();
            showToast('Добавлено в библиотеку!'); renderStore();
        }

        function renderProfile() {
            const nick = document.getElementById('nick-input');
            if (nick && document.activeElement !== nick) {
                nick.value = profile.nickname;
            }
            const nameDisp = document.getElementById('prof-name-display');
            if (nameDisp) nameDisp.innerText = profile.nickname || 'Gamer_Nappy';
            
            const avImg = document.getElementById('prof-avatar-img');
            const avTxt = document.getElementById('prof-avatar-txt');
            
            if (profile.avatar && profile.avatar.startsWith('data:image')) {
                if (avImg) { avImg.src = profile.avatar; avImg.style.display = 'block'; }
                if (avTxt) avTxt.style.display = 'none';
            } else {
                if (avImg) avImg.style.display = 'none';
                if (avTxt) avTxt.style.display = 'block';
            }

            const pb = document.getElementById('prof-balance');
            if (pb) pb.innerText = balance;
        }

        function onNickInput(el) {
            const cleanVal = (el.value || '').trim().slice(0, 20);
            profile.nickname = cleanVal;
            const nameDisp = document.getElementById('prof-name-display');
            if (nameDisp) nameDisp.innerText = cleanVal || 'Gamer_Nappy';
            saveState();
        }

        function handleAvatarUpload(inp) {
            const f = inp.files && inp.files[0]; if (!f) return;
            const url = URL.createObjectURL(f);
            const img = new Image();
            img.onload = () => {
                try {
                    const maxW = 200, k = Math.min(1, maxW / img.width);
                    const cv = document.createElement('canvas');
                    cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
                    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
                    profile.avatar = cv.toDataURL('image/jpeg', 0.85);
                    saveState(); 
                    renderProfile(); 
                    showToast('Фото профиля обновлено!');
                } catch (e) { 
                    showToast('Файл слишком большой'); 
                }
                URL.revokeObjectURL(url); inp.value = '';
            };
            img.onerror = () => { URL.revokeObjectURL(url); inp.value = ''; showToast('Ошибка файла'); };
            img.src = url;
        }

        function openGamePage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('game-page').classList.add('active');
            const zone = document.getElementById('action-zone');
            if(!owned.includes(id)) {
                zone.innerHTML = '<p style="color:var(--danger); font-weight:bold; margin-bottom:15px;">🔒 Сначала добавьте игру в библиотеку!</p>';
            } else {
                zone.innerHTML = '<button class="btn" style="background:var(--success);" onclick="startGame()">ИГРАТЬ (На весь экран)</button>';
            }
            loadComments();
        }

        // ===== Комментарии =====
        async function loadComments() {
            const list = document.getElementById('comments-list');
            list.innerHTML = '<p style="color:var(--text-muted); font-size:12px;">Загрузка...</p>';
            try {
                const res = await fetch('/api/comments');
                const data = await res.json();
                if (data.length === 0) {
                    list.innerHTML = '<p style="color:var(--text-muted); font-size:12px;">Пока нет отзывов. Будь первым!</p>';
                    return;
                }
                list.innerHTML = data.reverse().map(c => `
                    <div class="comment-item">
                        <div class="comment-author">${esc(c.name)}</div>
                        <div class="comment-text">${esc(c.text)}</div>
                    </div>
                `).join('');
            } catch (e) {
                list.innerHTML = '<p style="color:var(--danger); font-size:12px;">Ошибка сервера</p>';
            }
        }

        async function postComment() {
            const txt = document.getElementById('comment-text').value.trim();
            if (!txt) return showToast('Введите текст!');
            const name = profile.nickname || 'Аноним';
            
            try {
                const res = await fetch('/api/comments', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, text: txt })
                });
                if (res.ok) {
                    document.getElementById('comment-text').value = '';
                    loadComments();
                    showToast('Отзыв добавлен!');
                } else {
                    showToast('Ошибка сервера');
                }
            } catch (e) {
                showToast('Нет связи с сервером');
            }
        }

        async function enterFullscreen() {
            const ov = document.getElementById('launcher-overlay');
            try {
                if (ov.requestFullscreen) await ov.requestFullscreen({ navigationUI: 'hide' });
                else if (ov.webkitRequestFullscreen) ov.webkitRequestFullscreen();
                else if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
            } catch (e) { }
        }

        function exitFullscreen() {
            try {
                if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitFullscreenElement && document.webkitExitFullscreen) document.webkitExitFullscreen();
            } catch (e) {}
        }

        function startGame() {
            const ov = document.getElementById('launcher-overlay');
            ov.classList.add('open');
            gameOpen = true;
            document.body.style.overflow = 'hidden';
            try { history.pushState({ ghGame: true }, '', '#play'); } catch (e) {}
            enterFullscreen();
            
            if (loadTimer) { clearInterval(loadTimer); loadTimer = null; }
            document.getElementById('loader-screen').style.display = 'flex';
            const iframe = document.getElementById('launcher-iframe');
            iframe.style.display = 'none';
            const fill = document.getElementById('progress-fill'); const pct = document.getElementById('loader-percent');
            fill.style.width = '0%'; pct.innerText = '0%';
            
            let p = 0;
            loadTimer = setInterval(() => {
                p += Math.floor(Math.random()*16) + 8;
                if (p >= 100) {
                    p = 100; clearInterval(loadTimer); loadTimer = null;
                    document.getElementById('loader-screen').style.display = 'none';
                    iframe.src = 'https://evoworld.io/';
                    iframe.style.display = 'block';
                }
                fill.style.width = p+'%'; pct.innerText = p+'%';
            }, 160);
        }

        function stopGame() {
            if (!gameOpen) return;
            gameOpen = false;
            if (loadTimer) { clearInterval(loadTimer); loadTimer = null; }
            exitFullscreen();
            document.body.style.overflow = '';
            const ov = document.getElementById('launcher-overlay');
            ov.classList.remove('open');
            document.getElementById('loader-screen').style.display = 'flex';
            const iframe = document.getElementById('launcher-iframe');
            iframe.src = 'about:blank'; iframe.style.display = 'none';
            
            if (!ignorePop) {
                try { if (location.hash === '#play') history.back(); } catch (e) {}
            }
            ignorePop = false;
        }

        window.addEventListener('popstate', () => {
            if (gameOpen) { ignorePop = true; stopGame(); }
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && gameOpen) stopGame();
        });
        
        (function () {
            let taps = [];
            const z = document.getElementById('exit-gesture-zone');
            if (!z) return;
            z.addEventListener('pointerdown', () => {
                const now = Date.now();
                taps = taps.filter(t => now - t < 800);
                taps.push(now);
                if (taps.length >= 3) { taps = []; stopGame(); }
            });
        })();

        renderStore(); updateUI(); renderProfile();
        setInterval(updateUI, 60000);

        (function boot() {
            const b = document.getElementById('boot');
            if (!b) return;
            let gone = false;
            const done = () => {
                if (gone) return; gone = true;
                b.classList.add('hide');
                setTimeout(() => b.remove(), 600);
            };
            b.addEventListener('click', done);
            setTimeout(done, 2800);
        })();
    </script>
</body>
</html>
